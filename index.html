<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Booking Form & Instant Receipt Generator</title>
    <!-- Tailwind CSS for mobile-friendly UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function TourApp() {
            const [formData, setFormData] = useState({
                name: '',
                gmail: '',
                number: '',
                country: '',
                tripType: '',
                numPeople: 1,
                days: 1,
                carOption: 'company-choose',
                customCar: '',
                matatuOption: 'no',
                matatuChoice: '',
                driver: 'yes',
                destination: '',
                bnb: 'yes',
                bnbRooms: 1,
                airportPickup: 'yes',
                specialRequests: ''
            });

            const [submitted, setSubmitted] = useState(false);
            const [receipt, setReceipt] = useState(null);

            const handleChange = (e) => {
                const { name, value } = e.target;
                setFormData(prev => ({ ...prev, [name]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                
                const days = parseInt(formData.days) || 1;
                const count = parseInt(formData.numPeople) || 1;
                const rooms = formData.bnb === 'yes' ? (parseInt(formData.bnbRooms) || 1) : 0;
                const hasDriver = formData.driver === 'yes';

                // Cost Matrix Constants (USD)
                const airportFee = formData.airportPickup === 'yes' ? 40 : 0;
                const bnbRoomRateDay = 75; // Average BnB room rate per day

                let calculatedTiers = null;

                if (formData.carOption === 'company-choose') {
                    // Calculating Low, Mid, High tiers
                    const tiers = [
                        { key: 'low', name: 'Low-End (Economy Sedan)', carDaily: 40, driverDaily: 20 },
                        { key: 'mid', name: 'Mid-Range (4x4 Safari Van/Cruiser)', carDaily: 130, driverDaily: 40 },
                        { key: 'high', name: 'High-End (Luxury Custom V8)', carDaily: 260, driverDaily: 70 }
                    ];

                    calculatedTiers = {};
                    tiers.forEach(tier => {
                        const driverCostTotal = hasDriver ? (tier.driverDaily * days) : 0;
                        const carCostTotal = tier.carDaily * days;
                        const bnbCostTotal = rooms * bnbRoomRateDay * days;
                        const grandTotal = carCostTotal + driverCostTotal + bnbCostTotal + airportFee;

                        calculatedTiers[tier.key] = {
                            title: tier.name,
                            carCost: carCostTotal,
                            driverCost: driverCostTotal,
                            bnbCost: bnbCostTotal,
                            airportFee: airportFee,
                            grandTotal: grandTotal,
                            driverDailyRate: tier.driverDaily
                        };
                    });
                } else {
                    // Custom car cost calculation
                    const carDaily = 100; // Average custom car daily
                    const driverDaily = 40;
                    const driverCostTotal = hasDriver ? (driverDaily * days) : 0;
                    const carCostTotal = carDaily * days;
                    const bnbCostTotal = rooms * bnbRoomRateDay * days;

                    calculatedTiers = {
                        custom: {
                            title: `Custom Car: ${formData.customCar || 'Requested Vehicle'}`,
                            carCost: carCostTotal,
                            driverCost: driverCostTotal,
                            bnbCost: bnbCostTotal,
                            airportFee: airportFee,
                            grandTotal: carCostTotal + driverCostTotal + bnbCostTotal + airportFee,
                            driverDailyRate: driverDaily
                        }
                    };
                }

                setReceipt({
                    receiptNo: 'REC-' + Math.floor(100000 + Math.random() * 900000),
                    date: new Date().toLocaleDateString(),
                    days,
                    rooms,
                    count,
                    tiers: calculatedTiers
                });

                setSubmitted(true);
            };

            return (
                <div class="max-w-2xl mx-auto p-4 sm:p-6 my-6 bg-white shadow-xl rounded-2xl border border-slate-200">
                    <div class="text-center mb-6">
                        <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">Tour Booking & Receipt Estimator</h1>
                        <p class="text-xs sm:text-sm text-slate-500 mt-1">Get an instant itemized breakdown & budget receipts</p>
                    </div>

                    {!submitted ? (
                        <form onSubmit={handleSubmit} class="space-y-4 text-sm">
                            {/* Contact Info Group */}
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Full Name *</label>
                                    <input type="text" name="name" required value={formData.name} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="John Doe" />
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Gmail Address *</label>
                                    <input type="email" name="gmail" required value={formData.gmail} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="john@gmail.com" />
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Phone Number *</label>
                                    <input type="tel" name="number" required value={formData.number} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="+254 700 000000" />
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Country of Origin *</label>
                                    <input type="text" name="country" required value={formData.country} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Kenya, USA" />
                                </div>
                            </div>

                            {/* Trip Info */}
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Type of Trip *</label>
                                    <select name="tripType" required value={formData.tripType} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                                        <option value="">Select trip type...</option>
                                        <option value="personal">Personal</option>
                                        <option value="business">Business</option>
                                        <option value="family">Family</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">Destination *</label>
                                    <input type="text" name="destination" required value={formData.destination} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. Maasai Mara, Diani" />
                                </div>
                            </div>

                            {/* Dynamic Group Size & Duration */}
                            {formData.tripType && (
                                <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Number of People</label>
                                        <input type="number" name="numPeople" min="1" value={formData.numPeople} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white outline-none" />
                                    </div>
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Trip Duration (Days)</label>
                                        <input type="number" name="days" min="1" value={formData.days} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white outline-none" />
                                    </div>
                                </div>
                            )}

                            {/* Matatu Logic (> 20 People) */}
                            {parseInt(formData.numPeople) > 20 && (
                                <div class="p-4 bg-amber-50 rounded-xl border border-amber-200 space-y-3">
                                    <label class="block font-semibold text-amber-900">Group size is over 20 people. Would you like a Matatu / Bus option?</label>
                                    <select name="matatuOption" value={formData.matatuOption} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                                        <option value="no">No, use separate 4x4 vehicles</option>
                                        <option value="yes">Yes, request Matatu / Bus transport</option>
                                    </select>
                                    {formData.matatuOption === 'yes' && (
                                        <input type="text" name="matatuChoice" placeholder="Specify Matatu name or details (e.g. 33-Seater Executive Bus)" value={formData.matatuChoice} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" />
                                    )}
                                </div>
                            )}

                            {/* Car Selection */}
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Type of Car</label>
                                <select name="carOption" value={formData.carOption} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                                    <option value="company-choose">Let the company choose (Generates Low, Mid & High Receipts)</option>
                                    <option value="select">Write my own car preference</option>
                                </select>
                                {formData.carOption === 'select' && (
                                    <input type="text" name="customCar" placeholder="Write preferred car model (e.g. Prado TX, Safari Cruiser)" value={formData.customCar} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white mt-2" />
                                )}
                            </div>

                            {/* Driver Selection */}
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Driver Option</label>
                                <select name="driver" value={formData.driver} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                                    <option value="yes">Yes (Include professional driver-guide)</option>
                                    <option value="no">No (Self-drive)</option>
                                </select>
                            </div>

                            {/* BnB + Number of Rooms Conditional */}
                            <div class="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-3">
                                <div>
                                    <label class="block font-semibold text-slate-700 mb-1">BnB / Accommodation Option</label>
                                    <select name="bnb" value={formData.bnb} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                                        <option value="yes">Yes, include BnB accommodation</option>
                                        <option value="no">No, I have my own lodging</option>
                                    </select>
                                </div>

                                {formData.bnb === 'yes' && (
                                    <div>
                                        <label class="block font-semibold text-slate-700 mb-1">Number of Rooms Needed</label>
                                        <input type="number" name="bnbRooms" min="1" value={formData.bnbRooms} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" placeholder="e.g. 2 rooms" />
                                    </div>
                                )}
                            </div>

                            {/* Airport Pickup */}
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Airport Pick up</label>
                                <select name="airportPickup" value={formData.airportPickup} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                                    <option value="yes">Yes ($40 flat fee)</option>
                                    <option value="no">No</option>
                                </select>
                            </div>

                            {/* Special Requests */}
                            <div>
                                <label class="block font-semibold text-slate-700 mb-1">Special Requests</label>
                                <textarea name="specialRequests" rows="2" value={formData.specialRequests} onChange={handleChange} class="w-full px-3 py-2 rounded-lg border border-slate-300" placeholder="Dietary needs, child seats, preferred pickup times..."></textarea>
                            </div>

                            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-4 rounded-xl transition shadow-lg shadow-blue-600/30">
                                Calculate & Generate Official Receipt
                            </button>
                        </form>
                    ) : (
                        /* DIGITAL RECEIPT VIEW */
                        <div class="space-y-6">
                            <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 text-center text-emerald-800">
                                <h2 class="text-lg font-bold">Booking Submitted Successfully!</h2>
                                <p class="text-xs mt-1">A digital copy of this quotation receipt has been dispatched to <b>{formData.gmail}</b>.</p>
                            </div>

                            {/* Receipt Container */}
                            <div class="border-2 border-slate-800 rounded-xl p-5 bg-amber-50/20 font-mono text-slate-800 shadow-sm">
                                <div class="flex justify-between items-start border-b border-slate-300 pb-3 mb-4">
                                    <div>
                                        <h2 class="font-bold text-xl uppercase tracking-wider text-slate-900">TOUR QUOTATION RECEIPT</h2>
                                        <p class="text-xs text-slate-500">Receipt ID: {receipt.receiptNo}</p>
                                        <p class="text-xs text-slate-500">Date: {receipt.date}</p>
                                    </div>
                                    <div class="text-right text-xs">
                                        <p class="font-bold">{formData.name}</p>
                                        <p>{formData.gmail}</p>
                                        <p>{formData.country}</p>
                                    </div>
                                </div>

                                <div class="text-xs border-b border-slate-300 pb-3 mb-4 space-y-1">
                                    <p><b>Destination:</b> {formData.destination}</p>
                                    <p><b>Trip Type:</b> {formData.tripType} | <b>Travelers:</b> {receipt.count} pax | <b>Duration:</b> {receipt.days} day(s)</p>
                                    {formData.bnb === 'yes' && <p><b>BnB Rooms Reserved:</b> {receipt.rooms} Room(s)</p>}
                                    {formData.matatuOption === 'yes' && <p><b>Matatu Request:</b> {formData.matatuChoice || 'Yes (Over 20 Pax)'}</p>}
                                    {formData.specialRequests && <p><b>Notes:</b> {formData.specialRequests}</p>}
                                </div>

                                {/* Itemized Tier Cost Breakdown */}
                                <div class="space-y-4">
                                    {Object.keys(receipt.tiers).map((tierKey) => {
                                        const t = receipt.tiers[tierKey];
                                        return (
                                            <div key={tierKey} class="bg-white p-4 rounded-lg border border-slate-200 shadow-sm font-sans space-y-2">
                                                <div class="flex justify-between items-center border-b pb-1">
                                                    <span class="font-bold text-blue-700">{t.title}</span>
                                                    <span class="font-bold text-lg text-slate-900">${t.grandTotal}</span>
                                                </div>
                                                <div class="text-xs text-slate-600 space-y-1">
                                                    <div class="flex justify-between">
                                                        <span>Vehicle Hire ({receipt.days} day[s]):</span>
                                                        <span>${t.carCost}</span>
                                                    </div>
                                                    <div class="flex justify-between">
                                                        <span>Driver Allowance (${t.driverDailyRate}/day):</span>
                                                        <span>${t.driverCost}</span>
                                                    </div>
                                                    {t.bnbCost > 0 && (
                                                        <div class="flex justify-between">
                                                            <span>BnB Accommodation ({receipt.rooms} room[s] x {receipt.days} day[s]):</span>
                                                            <span>${t.bnbCost}</span>
                                                        </div>
                                                    )}
                                                    {t.airportFee > 0 && (
                                                        <div class="flex justify-between">
                                                            <span>Airport Pick-Up Fee:</span>
                                                            <span>${t.airportFee}</span>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>

                                <div class="mt-4 pt-3 border-t border-slate-300 text-center text-xs text-slate-500">
                                    *** Thank you for choosing our tour service ***
                                </div>
                            </div>

                            <button onClick={() => setSubmitted(false)} class="w-full bg-slate-200 hover:bg-slate-300 text-slate-800 font-semibold py-2.5 px-4 rounded-xl transition">
                                Edit Details & Recalculate
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<TourApp />, document.getElementById('root'));
    </script>
</body>
</html>
